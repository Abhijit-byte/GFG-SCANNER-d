<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Attendance Scanner</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: #1a1a1a;
            color: white;
            padding: 1rem;
            min-height: 100vh;
        }

        .container {
            max-width: 720px;
            margin: auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        h1 { text-align: center; }

        #reader {
            width: 100%;
            border: 4px solid #3b82f6;
            border-radius: 12px;
            background: black;
        }

        .status {
            padding: 1rem;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            text-align: center;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .idle { background: #3b82f6; }
        .success { background: #10b981; color: black; }
        .error { background: #ef4444; }

        .qr-box {
            background: #2a2a2a;
            border: 2px solid #3b82f6;
            border-radius: 8px;
            padding: 1rem;
        }

        .hidden { display: none; }
    </style>
</head>

<body>
<div class="container">
    <h1>QR Attendance Scanner</h1>

    <div id="reader"></div>

    <div id="status" class="status idle">Ready to scan</div>

    <div id="qrBox" class="qr-box hidden">
        <strong>Scanned Code:</strong>
        <div id="qrValue"></div>
    </div>

    <p style="text-align:center;color:#9ca3af;">Point camera at QR code</p>
</div>

<script>
/* ================= CONFIG ================= */
const API_URL = "https://gfg-scanner-d.onrender.com/scan/";
const RESET_DELAY = 2500;

/* ================= STATE ================= */
let scanner;
let processing = false;
let lastValue = null;
let resetTimer = null;

/* ================= DOM ================= */
const statusEl = document.getElementById("status");
const qrBox = document.getElementById("qrBox");
const qrValue = document.getElementById("qrValue");

/* ================= UI HELPERS ================= */
function setStatus(text, type) {
    statusEl.textContent = text;
    statusEl.className = `status ${type}`;
}

function showQR(value) {
    qrValue.textContent = value;
    qrBox.classList.remove("hidden");
}

function hideQR() {
    qrBox.classList.add("hidden");
    qrValue.textContent = "";
}

/* ================= BACKEND CALL ================= */
async function verifyRegistration(regNo) {
    const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({ registration_number: regNo })
    });

    if (!res.ok) {
        throw new Error("Server error");
    }

    return res.json();
}

/* ================= SCAN HANDLER ================= */
async function onScanSuccess(decodedText) {
    const regNo = decodedText.trim();

    if (processing || regNo === lastValue) return;

    processing = true;
    lastValue = regNo;

    setStatus("Checking registration…", "idle");
    showQR(regNo);

    scanner.pause();

    try {
        const data = await verifyRegistration(regNo);

        if (data.status === "success") {
            setStatus(`✔ ${data.name} marked present`, "success");
        } else if (data.status === "already_marked") {
            setStatus(`⚠ ${data.name} already logged in`, "error");
        } else if (data.status === "not_registered") {
            setStatus("❌ Registration not found", "error");
        } else {
            setStatus("❌ Invalid QR", "error");
        }
    } catch (err) {
        setStatus("❌ Network / Server error", "error");
    }

    clearTimeout(resetTimer);
    resetTimer = setTimeout(() => {
        processing = false;
        lastValue = null;
        hideQR();
        setStatus("Ready to scan", "idle");
        scanner.resume();
    }, RESET_DELAY);
}

/* ================= INIT ================= */
async function initScanner() {
    try {
        scanner = new Html5Qrcode("reader");
        await scanner.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: 250 },
            onScanSuccess
        );
    } catch (err) {
        console.error(err);
        setStatus("Camera permission denied", "error");
    }
}

window.addEventListener("load", initScanner);
</script>
</body>
</html>
